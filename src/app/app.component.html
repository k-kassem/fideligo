<div *ngIf="isLoading" class="min-h-screen flex items-center justify-center bg-gray-50">
  <div class="flex flex-col items-center">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-orange-500"></div>
    <p class="mt-4 text-gray-600">Chargement...</p>
  </div>
</div>

<div *ngIf="!isLoading">
  <app-login-page *ngIf="!isAuthenticated || !user" (loginSuccess)="onLoginSuccess()"></app-login-page>

  <!-- Dashboard components based on role -->
  <app-admin-dashboard *ngIf="isAuthenticated && user && user.role === 'admin'"></app-admin-dashboard>
  <app-restaurant-dashboard *ngIf="isAuthenticated && user && user.role === 'restaurant'"></app-restaurant-dashboard>
  <app-client-dashboard *ngIf="isAuthenticated && user && user.role === 'client'"></app-client-dashboard>
</div>
