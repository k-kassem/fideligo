<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-orange-50 to-red-50 p-4">
  <div class="w-full max-w-lg shadow-xl bg-white rounded-lg">
    <div class="text-center space-y-4 p-6 border-b">
      <div class="flex justify-center">
        <div class="bg-orange-500 p-4 rounded-full">
          <svg class="h-10 w-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
          </svg>
        </div>
      </div>
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Fidélité Restaurant</h1>
        <p class="text-gray-600" *ngIf="view === 'login'">Connectez-vous à votre compte</p>
        <p class="text-gray-600" *ngIf="view === 'register'">Créer un compte client</p>
        <p class="text-gray-600" *ngIf="view === 'verify'">Vérification du compte client</p>
      </div>
    </div>

    <div class="p-6">
      <div *ngIf="error" class="mb-4 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded">
        {{ error }}
      </div>
      <div *ngIf="success" class="mb-4 bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded">
        {{ success }}
      </div>

      <!-- Login page -->
      <form *ngIf="view === 'login'" (ngSubmit)="onSubmit()" class="space-y-4">
        <div class="space-y-2">
          <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
          <input
            id="email"
            type="email"
            placeholder="votre@email.com"
            [(ngModel)]="email"
            name="email"
            required
            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-orange-500 focus:border-orange-500"
          />
        </div>

        <div class="space-y-2">
          <label for="password" class="block text-sm font-medium text-gray-700">Mot de passe</label>
          <input
            id="password"
            type="password"
            placeholder="••••••••"
            [(ngModel)]="password"
            name="password"
            required
            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-orange-500 focus:border-orange-500"
          />
        </div>

        <button
          type="submit"
          class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-2 px-4 rounded-md disabled:opacity-50"
          [disabled]="isLoading"
        >
          {{ isLoading ? 'Connexion...' : 'Se connecter' }}
        </button>

        <button
          type="button"
          class="w-full border border-orange-500 text-orange-600 hover:bg-orange-50 font-semibold py-2 px-4 rounded-md"
          (click)="showRegisterPage()"
        >
          Créer un compte client
        </button>
      </form>

      <!-- Register page -->
      <form *ngIf="view === 'register'" (ngSubmit)="onRegisterSubmit()" class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <input [(ngModel)]="registerModel.firstName" name="firstName" type="text" placeholder="Prénom" required class="w-full px-3 py-2 border border-gray-300 rounded-md">
          <input [(ngModel)]="registerModel.lastName" name="lastName" type="text" placeholder="Nom" required class="w-full px-3 py-2 border border-gray-300 rounded-md">
        </div>
        <input [(ngModel)]="registerModel.email" name="registerEmail" type="email" placeholder="Email" required class="w-full px-3 py-2 border border-gray-300 rounded-md">
        <input [(ngModel)]="registerModel.phone" name="phone" type="text" placeholder="Téléphone" required class="w-full px-3 py-2 border border-gray-300 rounded-md">
        <input [(ngModel)]="registerModel.region" name="region" type="text" placeholder="Région" required class="w-full px-3 py-2 border border-gray-300 rounded-md">
        <input [(ngModel)]="registerModel.password" name="registerPassword" type="password" placeholder="Mot de passe" required class="w-full px-3 py-2 border border-gray-300 rounded-md">
        <input [(ngModel)]="registerModel.confirmPassword" name="confirmPassword" type="password" placeholder="Confirmer le mot de passe" required class="w-full px-3 py-2 border border-gray-300 rounded-md">

        <button
          type="submit"
          class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-2 px-4 rounded-md disabled:opacity-50"
          [disabled]="isLoading"
        >
          {{ isLoading ? 'Création...' : 'Créer le compte' }}
        </button>

        <button
          type="button"
          class="w-full border border-gray-300 text-gray-700 hover:bg-gray-50 font-semibold py-2 px-4 rounded-md"
          (click)="showLoginPage()"
        >
          Retour à la connexion
        </button>
      </form>

      <!-- Verification page -->
      <form *ngIf="view === 'verify'" (ngSubmit)="onVerifySubmit()" class="space-y-4">
        <div class="space-y-2">
          <label class="block text-sm font-medium text-gray-700">Email</label>
          <input
            [(ngModel)]="verifyModel.email"
            name="verifyEmail"
            type="email"
            required
            class="w-full px-3 py-2 border border-gray-300 rounded-md"
          />
        </div>

        <div class="space-y-2">
          <label class="block text-sm font-medium text-gray-700">Code de vérification</label>
          <input
            [(ngModel)]="verifyModel.code"
            name="verifyCode"
            type="text"
            maxlength="6"
            placeholder="Ex: 123456"
            required
            class="w-full px-3 py-2 border border-gray-300 rounded-md tracking-widest"
          />
        </div>

        <div *ngIf="debugVerificationCode" class="text-xs text-gray-500 bg-gray-50 p-2 rounded">
          Code de test (dev): {{ debugVerificationCode }}
        </div>

        <button
          type="submit"
          class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-2 px-4 rounded-md disabled:opacity-50"
          [disabled]="isLoading"
        >
          {{ isLoading ? 'Vérification...' : 'Vérifier le compte' }}
        </button>

        <button
          type="button"
          class="w-full border border-orange-500 text-orange-600 hover:bg-orange-50 font-semibold py-2 px-4 rounded-md disabled:opacity-50"
          (click)="resendCode()"
          [disabled]="isLoading"
        >
          Renvoyer le code
        </button>

        <button
          type="button"
          class="w-full border border-gray-300 text-gray-700 hover:bg-gray-50 font-semibold py-2 px-4 rounded-md"
          (click)="showLoginPage()"
        >
          Retour à la connexion
        </button>
      </form>

      <div class="mt-6 p-4 bg-gray-50 rounded-lg text-sm text-gray-600" *ngIf="view === 'login'">
        <p class="font-semibold mb-2">Compte de démonstration :</p>
        <p><span class="font-medium">Admin:</span> admin&#64;fidelite.com / admin123</p>
      </div>
    </div>
  </div>
</div>
